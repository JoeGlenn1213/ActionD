name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

      - name: Run linter
        # v7 of the action installs golangci-lint v2.x, which is built with a
        # Go new enough to analyze this module (v1.64/go1.24 cannot load go 1.25).
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
